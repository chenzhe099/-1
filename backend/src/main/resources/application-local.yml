# ============================================
# 本地开发配置 — 无需 MySQL，使用 H2 内存库
# 启动: mvn spring-boot:run -Dspring-boot.run.profiles=local
# ============================================

spring:
  datasource:
    url: jdbc:h2:file:./data/smartfarm;AUTO_SERVER=TRUE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

# DeepSeek API
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  model: ${DEEPSEEK_MODEL:deepseek-vision}

# AI 服务地址（本机）
ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

server:
  port: 9090
